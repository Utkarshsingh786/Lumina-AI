[project]
name = "lumina-backend"
version = "0.1.0"
description = "Lumina AI Chatbot Platform - Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # AI Providers
    "openai>=1.58.0",
    "anthropic>=0.40.0",
    "tiktoken>=0.8.0",

    # Redis & Caching
    "redis[hiredis]>=5.2.0",
    "hiredis>=3.1.0",

    # Background Jobs
    "celery[redis]>=5.4.0",
    "kombu>=5.4.0",

    # HTTP Client
    "httpx>=0.28.0",

    # Logging
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "pendulum>=3.0.0",
    "ulid-py>=1.1.0",
    "tenacity>=9.0.0",

    # File processing
    "pypdf>=5.1.0",
    "python-magic>=0.4.27",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() pattern

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
