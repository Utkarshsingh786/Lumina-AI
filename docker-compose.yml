version: "3.9"

# ─── Local Development Stack ──────────────────────────
# Services:
#   postgres  — primary database with pgvector extension
#   redis     — cache + celery broker + celery results
#   backend   — FastAPI app (hot reload in dev)
#   worker    — Celery worker for background tasks
#   frontend  — Next.js dev server (hot reload)
#
# Run: docker compose up
# Reset DB: docker compose down -v && docker compose up

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumina_postgres
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_pass
      POSTGRES_DB: lumina_db
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumina_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lumina_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lumina:lumina_pass@postgres:5432/lumina_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lumina_worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lumina:lumina_pass@postgres:5432/lumina_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: lumina_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
